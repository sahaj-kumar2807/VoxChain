<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Interactive 3D Planet & Orbital Governance System
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 7.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Master Group
const masterGroup = new THREE.Group();
scene.add(masterGroup);

// Lighting
const ambientLight = new THREE.AmbientLight(0x2a3038, 1.2);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
keyLight.position.set(5, 4, 6);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xd4ff00, 3.5, 25);
rimLight.position.set(-6, -3, -4);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x406080, 1.2);
fillLight.position.set(-5, 3, 2);
scene.add(fillLight);

// Central Planet (Monochromatic Moon / Celestial Governance Core with crater procedural texture)
const canvasTex = document.createElement('canvas');
canvasTex.width = 1024;
canvasTex.height = 512;
const ctx = canvasTex.getContext('2d');
ctx.fillStyle = '#b0b5be';
ctx.fillRect(0, 0, 1024, 512);
// Add noise & craters
for (let i = 0; i < 400; i++) {
  const x = Math.random() * 1024;
  const y = Math.random() * 512;
  const r = Math.random() * 22 + 2;
  const grad = ctx.createRadialGradient(x, y, 1, x, y, r);
  grad.addColorStop(0, 'rgba(40,45,55,0.7)');
  grad.addColorStop(0.7, 'rgba(80,88,100,0.3)');
  grad.addColorStop(1, 'rgba(180,188,200,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
// Micro noise
for (let i = 0; i < 8000; i++) {
  ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.15)';
  ctx.fillRect(Math.random() * 1024, Math.random() * 512, 2, 2);
}
const bumpTexture = new THREE.CanvasTexture(canvasTex);
bumpTexture.wrapS = THREE.RepeatWrapping;
bumpTexture.wrapT = THREE.RepeatWrapping;

const planetGeo = new THREE.SphereGeometry(2.0, 64, 64);
const planetMat = new THREE.MeshStandardMaterial({
  color: 0xd4d8df,
  roughness: 0.72,
  metalness: 0.15,
  bumpMap: bumpTexture,
  bumpScale: 0.08
});
const planetMesh = new THREE.Mesh(planetGeo, planetMat);
masterGroup.add(planetMesh);

// Glowing Atmosphere Ring
const glowGeo = new THREE.RingGeometry(2.02, 2.2, 64);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xc8f03a,
  transparent: true,
  opacity: 0.25,
  side: THREE.DoubleSide
});
const glowRing = new THREE.Mesh(glowGeo, glowMat);
glowRing.rotation.x = Math.PI / 2;
masterGroup.add(glowRing);

// Concentric Orbit Lines & Vertical Harp Lines (as seen in the reference)
const orbitGroup = new THREE.Group();
masterGroup.add(orbitGroup);

// Horizontal Orbital Rings
const createOrbitRing = (radius, opacity = 0.3) => {
  const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, 2 * Math.PI, false, 0);
  const points = curve.getPoints(128);
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({ color: 0x8a99ad, transparent: true, opacity: opacity });
  const line = new THREE.Line(geometry, material);
  line.rotation.x = Math.PI / 2;
  return line;
};

const ring1 = createOrbitRing(2.6, 0.4);
const ring2 = createOrbitRing(3.2, 0.25);
const ring3 = createOrbitRing(3.9, 0.18);
orbitGroup.add(ring1, ring2, ring3);

// Geometric Orbital Nodes (Moons / Governance Nodes)
const nodeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.8 });
const nodeAccentMat = new THREE.MeshBasicMaterial({ color: 0xd4ff00 });

const node1 = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), nodeMat);
const node2 = new THREE.Mesh(new THREE.SphereGeometry(0.14, 32, 32), nodeAccentMat);
const node3 = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), nodeMat);
masterGroup.add(node1, node2, node3);

// Vertical Harp Strum / Technical Stream Lines (Iconic to the video reference)
const streamGroup = new THREE.Group();
masterGroup.add(streamGroup);

const streamCount = 28;
for (let i = 0; i < streamCount; i++) {
  const angle = (i / streamCount) * Math.PI * 2;
  const radius = 2.45;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  
  const h = 4.5 + Math.sin(i * 0.7) * 1.2;
  const points = [
    new THREE.Vector3(x, -h / 2, z),
    new THREE.Vector3(x, h / 2, z)
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: i % 4 === 0 ? 0xd4ff00 : 0x5a6678,
    transparent: true,
    opacity: i % 4 === 0 ? 0.65 : 0.2
  });
  const line = new THREE.Line(geo, mat);
  streamGroup.add(line);
}

// Particle Field (Cosmic Data dust)
const particleCount = 600;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
  pPos[i] = (Math.random() - 0.5) * 18;
  pPos[i + 1] = (Math.random() - 0.5) * 18;
  pPos[i + 2] = (Math.random() - 0.5) * 12;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0xa0b0c5,
  size: 0.035,
  transparent: true,
  opacity: 0.55
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Mouse Interaction & Scroll Listeners
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;
let scrollProgress = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

window.addEventListener('scroll', () => {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  scrollProgress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
});

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  // Planet slow celestial rotation
  planetMesh.rotation.y = elapsed * 0.12 + scrollProgress * Math.PI * 2;
  planetMesh.rotation.x = 0.15 + targetY * 0.2;

  // Stream rotation
  streamGroup.rotation.y = elapsed * 0.05;

  // Orbit Nodes position & motion
  const n1Angle = elapsed * 0.4 + scrollProgress * 4.0;
  node1.position.set(Math.cos(n1Angle) * 2.6, Math.sin(elapsed * 0.8) * 0.3, Math.sin(n1Angle) * 2.6);

  const n2Angle = -elapsed * 0.65;
  node2.position.set(Math.cos(n2Angle) * 3.2, Math.cos(elapsed * 0.5) * 0.4, Math.sin(n2Angle) * 3.2);

  const n3Angle = elapsed * 0.25 + 1.8;
  node3.position.set(Math.cos(n3Angle) * 3.9, Math.sin(elapsed * 0.3) * 0.5, Math.sin(n3Angle) * 3.9);

  // Group tilt reacting to mouse & scroll transitions
  masterGroup.rotation.y = targetX * 0.4 + (scrollProgress * 0.8);
  masterGroup.rotation.x = targetY * 0.25 + Math.sin(elapsed * 0.2) * 0.05;
  masterGroup.position.y = (scrollProgress - 0.5) * 0.8;

  // Geometric scale pulse according to governance state
  const targetScale = 1.0 + Math.sin(scrollProgress * Math.PI * 4) * 0.12;
  masterGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.05);

  particles.rotation.y = elapsed * 0.02;

  renderer.render(scene, camera);
}
animate();

// Resize Handler
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
